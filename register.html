<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Alex Reed - Audio Restoration Specialist</title>
    <link rel="icon" type="image/png" href="assets/images/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/dark-mode.css">
    <link rel="stylesheet" href="assets/css/rtl.css">
    <style>
        body { background: radial-gradient(circle at bottom left, var(--primary-color), var(--secondary-color)); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem 0; }
        .register-card { width: 100%; max-width: 550px; }
    </style>
</head>
<body>

    <!-- Theme and RTL Toggles -->
    <div class="auth-nav-utility position-absolute top-0 end-0 p-3 z-3">
        <div class="nav-utility-wrapper d-flex gap-2">
            <button class="btn btn-link text-white" id="theme-toggle" title="Toggle Theme"><i
                    class="bi bi-sun-fill"></i></button>
            <button class="btn btn-link text-white" id="rtl-toggle" title="Toggle RTL"><i
                    class="bi bi-arrow-left-right"></i></button>
        </div>
    </div>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 register-card">
                <div class="glass-card">
                    <div class="text-center mb-4">
                        <a href="index.html" class="d-flex align-items-center justify-content-center mb-4 text-decoration-none">
                            <div class="logo-icon me-2">
                                <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M5 20C5 11.7157 11.7157 5 20 5C28.2843 5 35 11.7157 35 20C35 28.2843 28.2843 35 20 35C11.7157 35 5 28.2843 5 20Z" stroke="url(#paint0_linear)" stroke-width="2"/>
                                    <path d="M10 20C10 20 12.5 10 15 20C17.5 30 20 20 20 20C20 20 22.5 10 25 20C27.5 30 30 20 30 20" stroke="var(--accent-color)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                                    <defs>
                                        <linearGradient id="paint0_linear" x1="5" y1="5" x2="35" y2="35" gradientUnits="userSpaceOnUse">
                                            <stop stop-color="var(--accent-color)" />
                                            <stop offset="1" stop-color="#7dd3fc" />
                                        </linearGradient>
                                    </defs>
                                </svg>
                            </div>
                            <span class="fw-bold text-white fs-4 tracking-tight">ALEX REED</span>
                        </a>
                        <h2 class="text-white fw-bold h3">Client Register</h2>
                        <p class="text-muted small">Start your professional audio restoration project</p>
                    </div>

                    <form class="needs-validation" novalidate>
                        <div class="row g-3">
                            <div class="col-12">
                                <label class="form-label text-white">Full Name</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-transparent border-secondary border-end-0 text-muted"><i class="bi bi-person"></i></span>
                                    <input type="text" class="form-control bg-transparent border-secondary border-start-0 text-white" required placeholder="Alex Reed">
                                </div>
                            </div>
                            <div class="col-12">
                                <label class="form-label text-white">Email Address</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-transparent border-secondary border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
                                    <input type="email" class="form-control bg-transparent border-secondary border-start-0 text-white" required placeholder="alex@example.com">
                                </div>
                            </div>
                            <div class="col-12">
                                <label class="form-label text-white">Password</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-transparent border-secondary border-end-0 text-muted"><i class="bi bi-lock"></i></span>
                                    <input type="password" class="form-control bg-transparent border-secondary border-start-0 border-end-0 text-white" required placeholder="••••••••">
                                    <button class="btn btn-link input-group-text bg-transparent border-secondary border-start-0 text-muted toggle-password" type="button" style="text-decoration: none; border-top: 1px solid rgba(108,117,125,0.5); border-bottom: 1px solid rgba(108,117,125,0.5);">
                                        <i class="bi bi-eye"></i>
                                    </button>
                                </div>
                            </div>
                            <div class="col-12">
                                <label class="form-label text-white">Confirm Password</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-transparent border-secondary border-end-0 text-muted"><i class="bi bi-lock-fill"></i></span>
                                    <input type="password" class="form-control bg-transparent border-secondary border-start-0 border-end-0 text-white" required placeholder="••••••••">
                                    <button class="btn btn-link input-group-text bg-transparent border-secondary border-start-0 text-muted toggle-password" type="button" style="text-decoration: none; border-top: 1px solid rgba(108,117,125,0.5); border-bottom: 1px solid rgba(108,117,125,0.5);">
                                        <i class="bi bi-eye"></i>
                                    </button>
                                </div>
                            </div>
                            <div class="col-12 mt-3">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" value="" id="termsCheck" required>
                                    <label class="form-check-label text-muted small" for="termsCheck">
                                        I agree to the <a href="#" class="text-accent text-decoration-none">Terms of Service</a> and <a href="#" class="text-accent text-decoration-none">Privacy Policy</a>
                                    </label>
                                    <div class="invalid-feedback">You must agree before submitting.</div>
                                </div>
                            </div>
                            <div class="col-12 mt-4">
                                <button type="submit" class="btn btn-primary-custom w-100 py-3 mb-4">Create Account</button>
                                
                                <div class="position-relative mb-4">
                                    <hr class="text-secondary opacity-25">
                                    <span class="position-absolute top-50 start-50 translate-middle px-3 small auth-separator-text">Or sign up with</span>
                                </div>
                                
                                <div class="row g-3">
                                    <div class="col-6">
                                        <button type="button" class="btn btn-outline-custom w-100 py-2 d-flex align-items-center justify-content-center gap-2">
                                            <i class="bi bi-google"></i> Google
                                        </button>
                                    </div>
                                    <div class="col-6">
                                        <button type="button" class="btn btn-outline-custom w-100 py-2 d-flex align-items-center justify-content-center gap-2">
                                            <i class="bi bi-apple"></i> Apple
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
                <p class="text-center text-muted mt-4 small">Already have an account? <a href="login.html" class="text-accent text-decoration-none">Sign in</a></p>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
